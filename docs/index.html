<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aily 企业智能助手</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f6f8;
        color: #1f2329;
        font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      }
      main {
        width: min(520px, calc(100% - 32px));
        padding: 32px;
        background: #fff;
        border: 1px solid #dee0e3;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgb(31 35 41 / 6%);
      }
      h1 {
        margin: 0 0 8px;
        color: #3370ff;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 20px;
        color: #646a73;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        background: #3370ff;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aily</h1>
      <p>企业智能助手 GitHub Pages 演示入口。静态托管无后端，工作台使用前端 Mock 数据。</p>
      <a href="./app/">打开对话工作台</a>
    </main>
  </body>
</html>
